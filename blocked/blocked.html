<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Website Geblokkeerd - Guardian Kids</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 600px;
    }

    .icon {
      font-size: 80px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
      font-weight: 600;
    }

    p {
      font-size: 1.2em;
      line-height: 1.6;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    .info-box {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 20px;
      margin: 20px 0;
      backdrop-filter: blur(10px);
    }

    .time-info {
      font-size: 1.1em;
      margin-top: 10px;
    }

    .footer {
      margin-top: 40px;
      font-size: 0.9em;
      opacity: 0.7;
    }

    a {
      color: white;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🛡️</div>
    <h1>Stop! Deze website mag niet.</h1>
    <p>Deze website is geblokkeerd door papa of mama.</p>

    <div class="info-box">
      <p style="margin: 0; opacity: 0.8; font-size: 0.95em;">Geblokkeerd op:</p>
      <div id="timeInfo" class="time-info"></div>
    </div>

    <div class="footer">
      <p>Vraag het aan papa of mama als je denkt dat dit niet klopt.</p>
    </div>
  </div>

  <script src="blocked.js"></script>
</body>
</html>
